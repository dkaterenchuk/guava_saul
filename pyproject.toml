[project]
name = "guava-saul"
version = "0.1.0"
description = "Saul Goodman & Associates voice intake agent (Guava hackathon demo)"
requires-python = ">=3.10"
dependencies = [
    "guava-sdk>=0.48.0",
    "anthropic>=1.15.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saul*"]
