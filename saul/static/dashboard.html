<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saul Operator Console</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e2230; --line: #2a2f3d;
    --text: #e8eaf0; --muted: #9aa3b5; --accent: #f2b53d; --caller: #2f6fed; --agent: #2d3748;
    --ok: #3ccf8e; --warn: #f2b53d; --danger: #ef5350;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); text-transform: uppercase; letter-spacing: .4px; }
  .badge.greet, .badge.intake { color: #8ab4ff; } .badge.confirm { color: #c7a4ff; } .badge.advice { color: var(--ok); }
  .badge.wrap { color: var(--muted); } .badge.safety { color: var(--danger); border-color: var(--danger); } .badge.handoff { color: var(--warn); }
  .spacer { flex: 1; }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.live::before { content: "●"; color: var(--ok); margin-right: 5px; }
  .status.off::before { content: "●"; color: var(--danger); margin-right: 5px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 0; height: calc(100% - 46px); }
  #transcript { overflow-y: auto; padding: 16px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px; }
  .turn { display: flex; margin: 0 0 10px; gap: 10px; }
  .turn.caller { justify-content: flex-end; }
  .bubble { max-width: 70%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; }
  .turn.caller .bubble { background: var(--caller); border-bottom-right-radius: 3px; }
  .turn.agent .bubble { background: var(--agent); border-bottom-left-radius: 3px; }
  .turn .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .turn.caller .meta { text-align: right; }
  .bubble.interrupted { border-left: 3px solid var(--warn); }
  .marker { text-align: center; font-size: 11px; color: var(--muted); margin: 8px 0; }
  .marker.safety { color: var(--danger); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; margin-top: 80px; }
  section { margin-bottom: 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  section h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .field { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .field:last-child { border-bottom: 0; }
  .field .k { width: 120px; flex: none; color: var(--muted); }
  .field .v { flex: 1; }
  .field.done .k::before { content: "✓ "; color: var(--ok); }
  .field.todo .k::before { content: "○ "; color: var(--muted); }
  .banner { background: #3a1517; border: 1px solid var(--danger); color: #ffd3d3; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; font-weight: 600; }
  ul { margin: 4px 0 6px 18px; padding: 0; } li { margin: 2px 0; }
  .why { color: var(--muted); font-size: 12px; }
  details summary { cursor: pointer; font-weight: 600; margin: 4px 0; }
  .provider { font-size: 11px; color: var(--muted); }
  .notes { font-size: 11px; color: var(--muted); max-height: 160px; overflow-y: auto; }
  .notes div { padding: 1px 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1><span>Saul Goodman &amp; Associates</span> · operator console</h1>
  <span id="phase" class="badge greet">no call</span>
  <span id="timer" class="status"></span>
  <span class="spacer"></span>
  <label class="status">call <select id="calls"></select></label>
  <span id="conn" class="status off">connecting</span>
</header>
<main>
  <div id="transcript"><div class="empty">Waiting for a call. Start the agent with <code>--dashboard</code> and dial in.</div></div>
  <aside>
    <div id="safety"></div>
    <section><h2>Case file</h2><div id="case"></div></section>
    <section><h2>Guidance <span id="provider" class="provider"></span></h2><div id="advice"><span class="why">Generated after the story is confirmed.</span></div></section>
    <section><h2>Events</h2><div id="notes" class="notes"></div></section>
  </aside>
</main>
<script>
const FIELDS = ["state","what_happened","when_where","parties_involved","police_contact","charges_or_court_dates","statements_already_made","evidence_witnesses","caller_goal"];
const LABELS = {state:"State", what_happened:"What happened", when_where:"When / where", parties_involved:"Involved", police_contact:"Police contact", charges_or_court_dates:"Charges / dates", statements_already_made:"Said to others", evidence_witnesses:"Evidence", caller_goal:"Goal"};
let calls = {}; let order = []; let selected = null; let follow = true;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});

function applySnapshot(snap) {
  calls = {}; order = [];
  for (const c of snap.calls) { calls[c.id] = c; order.push(c.id); }
  if (!selected || !calls[selected]) selected = order[order.length - 1] || null;
  renderAll();
}

function applyEvent(e) {
  let c = calls[e.call_id];
  if (e.type === "call_start" || !c) {
    c = calls[e.call_id] = {id: e.call_id, label: e.label || "call", started_at: e.ts, ended_at: null, phase: "greet", turns: [], case: null, advice: null, advice_provider: null, safety: [], notes: [], termination_reason: null};
    if (!order.includes(e.call_id)) order.push(e.call_id);
    selected = e.call_id; follow = true;
    if (e.type === "call_start") { renderAll(); return; }
  }
  switch (e.type) {
    case "phase": c.phase = e.phase; c.notes.push({ts: e.ts, text: "phase: " + e.phase}); break;
    case "caller": {
      const t = c.turns.find(t => t.id === e.id);
      if (t) { t.text = e.text; t.ts = e.ts; } else c.turns.push({id: e.id, role: "caller", text: e.text, ts: e.ts, interrupted: false});
      break;
    }
    case "agent": c.turns.push({id: e.id, role: "agent", text: e.text, ts: e.ts, interrupted: !!e.interrupted}); break;
    case "case": c.case = e.case; break;
    case "advice": c.advice = e.advice; c.advice_provider = e.provider; break;
    case "safety": c.safety.push(e.category); c.notes.push({ts: e.ts, text: "SAFETY: " + e.category}); break;
    case "note": c.notes.push({ts: e.ts, text: e.text}); break;
    case "call_end": c.ended_at = e.ts; c.termination_reason = e.reason; c.notes.push({ts: e.ts, text: "call ended: " + e.reason}); break;
  }
  if (e.call_id === selected) renderAll(); else renderCallList();
}

function renderCallList() {
  const sel = $("calls");
  sel.innerHTML = order.slice().reverse().map(id => {
    const c = calls[id];
    const when = fmtTime(c.started_at);
    return `<option value="${id}" ${id === selected ? "selected" : ""}>${esc(c.label)} · ${when}${c.ended_at ? " (ended)" : ""}</option>`;
  }).join("") || `<option>none yet</option>`;
}

function renderAll() {
  renderCallList();
  const c = selected ? calls[selected] : null;
  const phase = $("phase");
  if (!c) { phase.textContent = "no call"; phase.className = "badge greet"; $("timer").textContent = ""; return; }
  phase.textContent = c.phase; phase.className = "badge " + c.phase;
  renderTranscript(c); renderCase(c); renderAdvice(c); renderSafety(c); renderNotes(c);
}

function renderTranscript(c) {
  const box = $("transcript");
  if (!c.turns.length && !c.notes.length) { box.innerHTML = `<div class="empty">Call connected. Waiting for the first turn.</div>`; return; }
  // Merge turns and phase/safety markers into one timeline.
  const items = [...c.turns.map(t => ({ts: t.ts, kind: "turn", t})), ...c.notes.filter(n => /^(phase|SAFETY|call ended)/.test(n.text)).map(n => ({ts: n.ts, kind: "marker", n}))];
  items.sort((a, b) => a.ts - b.ts);
  box.innerHTML = items.map(it => {
    if (it.kind === "marker") return `<div class="marker ${it.n.text.startsWith("SAFETY") ? "safety" : ""}">${esc(it.n.text)}</div>`;
    const t = it.t;
    return `<div class="turn ${t.role}"><div><div class="bubble ${t.interrupted ? "interrupted" : ""}">${esc(t.text)}</div><div class="meta">${t.role === "caller" ? "caller" : "Saul"} · ${fmtTime(t.ts)}${t.interrupted ? " · interrupted" : ""}</div></div></div>`;
  }).join("");
  if (follow) box.scrollTop = box.scrollHeight;
}

function renderCase(c) {
  const cf = c.case || {};
  $("case").innerHTML = FIELDS.map(k => {
    const v = cf[k]; const done = v && String(v).trim();
    return `<div class="field ${done ? "done" : "todo"}"><span class="k">${LABELS[k]}</span><span class="v">${done ? esc(v) : "<span class='why'>pending</span>"}</span></div>`;
  }).join("") + (cf.corrections && cf.corrections.length ? `<div class="field done"><span class="k">Corrections</span><span class="v">${esc(cf.corrections.join(" / "))}</span></div>` : "");
}

function renderAdvice(c) {
  const a = c.advice;
  $("provider").textContent = c.advice_provider ? `via ${c.advice_provider}` : "";
  if (!a) { $("advice").innerHTML = `<span class="why">Generated after the story is confirmed.</span>`; return; }
  const items = list => `<ul>${list.map(i => `<li>${esc(i.action)}<div class="why">${esc(i.why)}</div></li>`).join("")}</ul>`;
  const opts = a.options.map((o, i) => `<details><summary>Option ${i + 1}: ${esc(o.name)}</summary><div><b>Pros</b><ul>${o.pros.map(p => `<li>${esc(p)}</li>`).join("")}</ul><b>Cons</b><ul>${o.cons.map(p => `<li>${esc(p)}</li>`).join("")}</ul><div class="why">${esc(o.saul_take)}</div></div></details>`).join("");
  $("advice").innerHTML = `<b>Top 3</b><ol>${a.top3.map(t => `<li>${esc(t)}</li>`).join("")}</ol><details open><summary>Do</summary>${items(a.do)}</details><details><summary>Don't</summary>${items(a.dont)}</details>${opts}`;
}

function renderSafety(c) {
  $("safety").innerHTML = c.safety.length ? `<div class="banner">⚠ Safety signal: ${esc(c.safety.join(", "))}. Intake paused.</div>` : "";
}

function renderNotes(c) {
  $("notes").innerHTML = c.notes.slice().reverse().map(n => `<div>${fmtTime(n.ts)} · ${esc(n.text)}</div>`).join("") || `<span class="why">none yet</span>`;
}

function tick() {
  const c = selected ? calls[selected] : null;
  if (!c) return;
  const end = c.ended_at || Date.now() / 1000;
  const s = Math.max(0, Math.floor(end - c.started_at));
  $("timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` + (c.ended_at ? " · ended" : "");
}

$("calls").addEventListener("change", e => { selected = e.target.value; follow = true; renderAll(); });
$("transcript").addEventListener("scroll", e => { const el = e.target; follow = el.scrollHeight - el.scrollTop - el.clientHeight < 40; });

function connect() {
  const es = new EventSource("/events");
  es.addEventListener("snapshot", e => { $("conn").textContent = "live"; $("conn").className = "status live"; applySnapshot(JSON.parse(e.data)); });
  es.addEventListener("event", e => applyEvent(JSON.parse(e.data)));
  es.onerror = () => { $("conn").textContent = "reconnecting"; $("conn").className = "status off"; };
}
connect();
setInterval(tick, 1000);
</script>
</body>
</html>
